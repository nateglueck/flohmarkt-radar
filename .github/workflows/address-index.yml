name: Refresh address index

# The Austrian address register is republished twice a year (1 April, 1 October),
# so the offline autocomplete index only needs rebuilding after those dates.

on:
  schedule:
    - cron: "0 5 5 4,10 *"
  workflow_dispatch:
    inputs:
      stichtag:
        description: "Stichtag of the source data (YYYY-MM-DD), used for attribution"
        required: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install httpx pyproj

      - name: Build street index
        run: python -m app.build_address_index ${{ inputs.stichtag && format('--stichtag {0}', inputs.stichtag) || '' }}

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/streets site/data/address_meta.json
          git diff --quiet --staged || git commit -m "Refresh address index"
          git push

  publish:
    needs: rebuild
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      pages: write
      id-token: write
